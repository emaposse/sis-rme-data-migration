# PROCESSING
#-----------------------------------------------------------------------
etl_root_dir=
etl_conf_dir=

run_in_debug_mode=false
autoCommit=false
parallelProcessingStrategy=SINGLE_THREAD
processingBatch=2000
disableDemographics=false
disableMultithreadingSearch=false
maxSupportedProcessors=-1
disableMultithreadingSearch=false
overrideExistingDataModelElement=false
autoGenerateDataModelForParents=true
disableDataModelGeneration=true
dataModelType=static
binPojoDirectory=database-model/pojo/target/classes
srcPojoDirectory=database-model/pojo/src/main/java

ignoreAllStartupScripts=false

defaultUserId=1

# RUNNING MODE: db_synchronization/db_migration
mode=db_synchronization
running_remigrate=false

# LOG LEVEL: ERROR, WARN, INFO, DEBUG, TRACE
log_level=WARN
log_level_configuration=WARN
log_level_controller=WARN
log_level_engine=WARN
log_level_processor=WARN
log_level_dao=WARN
log_level_connection=WARN

# PROCESSING LOCATION
# ----------------------------------------------------------------------
location_name=SOURCE_LOCATION_NAME
hiv_destination_location_id=DESTINATION_LOCATION_ID
smi_destination_location_id=DESTINATION_LOCATION_ID
sync_destination_location_id=DESTINATION_LOCATION_ID

dst_tarv_service_id=TARV_SERVICE_ID
dst_ccr_service_id=CCR_SERVICE_ID
dst_prep_service_id=PREP_SERVICE_ID


tarv_program_id=2
ccr_program_id=6
prep_program_id=25


# DATABASE CONFIGURATION
# -------------------------------------------------------------------
src_db=SOURCE_DB_NAME
srcUserName=DB_USER_NAME
srcUserPassword=DB_USER_PASSWORD
srcConnectionURI=DB_CONNECTION_URI 
driveClassName=com.mysql.cj.jdbc.Driver

dstUserName=DB_USER_NAME
dstUserPassword=DB_USER_PASSWORD
dst_db=DESTINATION_DB_NAME
dstConnectionURI=DB_CONNECTION_URI 
driveClassName=com.mysql.cj.jdbc.Driver

connectionIsolationLevel=TRANSACTION_REPEATABLE_READ
maxActiveConnections=12
maxIdleConnections=12
minIdleConnections=4
src_location_list=SOURCE_LOCATION_LIST

# OPENMRS
# ------------------------------------------------------------------
openmrs_base_url=http://127.0.0.1:8080/openmrs
openmrs_username=
openmrs_password=

epts.etl.openmrs_base_url

# EXTRATION CONDITIONS
# ------------------------SYNC--------------------------------------
extra_condition=true
sync_fragments="sync/sesp-sync-fragments/*.json"

# -------------------- MIGRATION ----------------------------------
included_patient_extra_condition=true
included_person_extra_condition=true
included_person_b_extra_condition=true

# ERROR HANDLING
------------------------------------------------------------------
defaultExceptionBehavior=LOG
defaultInconsistencyBehavior=MARK_RECORD_AS_FAILED
stageRecordIssueBehavior=IGNORE
